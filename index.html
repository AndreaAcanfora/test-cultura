<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Test di Cultura — Quiz adattivo</title>
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter var"', 'Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .gradient-bg {
            background:
                radial-gradient(800px circle at 5% 5%, rgba(99,102,241,0.18), transparent 45%),
                radial-gradient(700px circle at 95% 90%, rgba(168,85,247,0.14), transparent 50%),
                #0a0a14;
        }
        .glass {
            background: rgba(20, 20, 35, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .chip { transition: all 120ms ease; }
        .chip:hover { background: rgba(99,102,241,0.2); }
        .ring-grad:focus-within { box-shadow: 0 0 0 3px rgba(99,102,241,0.4); }
        textarea { resize: vertical; }
        @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .fadein { animation: fadein 200ms ease-out both; }
        .spinner {
            width: 38px; height: 38px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        details summary { list-style: none; cursor: pointer; }
        details summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="gradient-bg text-slate-100 min-h-screen">

<header class="max-w-4xl mx-auto px-5 pt-10 pb-6">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 grid place-items-center shadow-lg shadow-indigo-500/30">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
        </div>
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Test di Cultura</h1>
            <p class="text-sm text-slate-400" id="headerSubtitle">Quiz adattivo basato su 60 materie</p>
        </div>
    </div>
</header>

<main id="app" class="max-w-4xl mx-auto px-5 pb-24"></main>

<footer class="max-w-4xl mx-auto px-5 py-8 text-center">
    <a href="https://www.paypal.com/paypalme/AndreaAca" target="_blank" rel="noopener noreferrer"
       class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 hover:bg-indigo-500/15 hover:border-indigo-400/40 transition text-sm text-slate-300 hover:text-white">
        <span class="text-rose-400">♥</span>
        <span>Ti è piaciuto? <span class="font-semibold text-indigo-300 group-hover:text-indigo-200">Offrimi un caffè</span></span>
    </a>
    <p class="text-[11px] text-slate-600 mt-3">paypal.me/AndreaAca</p>
</footer>

<!-- Templates -->
<template id="tpl-setup">
    <section class="fadein">
        <div class="glass rounded-2xl p-6 md:p-8 shadow-xl">
            <h2 class="text-xl font-semibold mb-1">Configura il tuo quiz</h2>
            <p class="text-sm text-slate-400 mb-6">Scegli modalità, livello e parametri. Il quiz inizierà subito dopo.</p>

            <!-- Nome / Nick -->
            <fieldset class="mb-6">
                <legend class="text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Il tuo nome <span class="text-rose-400 normal-case tracking-normal">(obbligatorio)</span></legend>
                <input
                    id="nameInput"
                    type="text"
                    maxlength="30"
                    autocomplete="off"
                    placeholder="Es. Andrea"
                    class="w-full bg-slate-900/70 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:border-indigo-400 focus:outline-none"
                >
                <p class="text-[11px] text-slate-500 mt-1">Sarà usato per la classifica. Max 30 caratteri.</p>
            </fieldset>

            <!-- Modalità -->
            <fieldset class="mb-6">
                <legend class="text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Modalità</legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="mode" value="adattiva" class="peer sr-only" checked>
                        <div class="rounded-xl border border-white/10 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 p-4 transition">
                            <div class="font-semibold flex items-center gap-2">
                                Adattiva
                                <span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-indigo-500/30 text-indigo-200">consigliata</span>
                            </div>
                            <p class="text-xs text-slate-400 mt-1">Parte facile, sale di livello quando rispondi bene.</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="mode" value="manuale" class="peer sr-only">
                        <div class="rounded-xl border border-white/10 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 p-4 transition">
                            <div class="font-semibold">Manuale</div>
                            <p class="text-xs text-slate-400 mt-1">Tu scegli la difficoltà delle domande.</p>
                        </div>
                    </label>
                </div>
            </fieldset>

            <!-- Tipo di risposta -->
            <fieldset class="mb-6">
                <legend class="text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Modalità risposta</legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="answerType" value="multiple" class="peer sr-only" checked>
                        <div class="rounded-xl border border-white/10 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 p-4 transition">
                            <div class="font-semibold flex items-center gap-2">🔘 Scelta multipla</div>
                            <p class="text-xs text-slate-400 mt-1">4 opzioni · −20% in classifica</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="answerType" value="open" class="peer sr-only">
                        <div class="rounded-xl border border-white/10 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 p-4 transition">
                            <div class="font-semibold flex items-center gap-2">✏️ Domande aperte</div>
                            <p class="text-xs text-slate-400 mt-1">Risposta libera · punteggio pieno</p>
                        </div>
                    </label>
                </div>
            </fieldset>

            <!-- Specificità -->
            <fieldset class="mb-6">
                <legend class="w-full text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold flex items-center justify-between gap-3">
                    <span>Specificità massima delle materie</span>
                    <span id="specValue" class="text-indigo-300 font-mono text-sm normal-case tracking-normal px-2 py-0.5 rounded bg-indigo-500/15">50</span>
                </legend>
                <input id="specSlider" type="range" min="20" max="100" value="50" step="5" class="w-full accent-indigo-400">
                <div class="flex justify-between text-[11px] text-slate-500 mt-1">
                    <span>20 — solo cultura generale</span>
                    <span>100 — incluse materie iperspecialistiche</span>
                </div>
            </fieldset>

            <!-- Numero domande -->
            <fieldset class="mb-6">
                <legend class="text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Numero di domande</legend>
                <div class="grid grid-cols-3 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="qcount" value="20" class="peer sr-only" checked>
                        <div class="rounded-xl border border-white/10 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 py-3 text-center font-semibold">20</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="qcount" value="25" class="peer sr-only">
                        <div class="rounded-xl border border-white/10 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 py-3 text-center font-semibold">25</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="qcount" value="30" class="peer sr-only">
                        <div class="rounded-xl border border-white/10 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 py-3 text-center font-semibold">30</div>
                    </label>
                </div>
            </fieldset>

            <!-- Range difficoltà (solo manuale) -->
            <fieldset id="rangesField" class="mb-6 hidden">
                <legend class="text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Difficoltà domande (almeno 1)</legend>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <label class="cursor-pointer">
                        <input type="checkbox" name="range" value="facile" class="peer sr-only" checked>
                        <div class="rounded-lg border border-white/10 peer-checked:border-emerald-400 peer-checked:bg-emerald-500/10 py-2 text-center text-sm font-medium">
                            Facile<br><span class="text-[10px] text-slate-500">5-25</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" name="range" value="medio" class="peer sr-only">
                        <div class="rounded-lg border border-white/10 peer-checked:border-amber-400 peer-checked:bg-amber-500/10 py-2 text-center text-sm font-medium">
                            Medio<br><span class="text-[10px] text-slate-500">26-50</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" name="range" value="difficile" class="peer sr-only">
                        <div class="rounded-lg border border-white/10 peer-checked:border-orange-400 peer-checked:bg-orange-500/10 py-2 text-center text-sm font-medium">
                            Difficile<br><span class="text-[10px] text-slate-500">51-75</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" name="range" value="esperto" class="peer sr-only">
                        <div class="rounded-lg border border-white/10 peer-checked:border-rose-400 peer-checked:bg-rose-500/10 py-2 text-center text-sm font-medium">
                            Esperto<br><span class="text-[10px] text-slate-500">76-100</span>
                        </div>
                    </label>
                </div>
            </fieldset>

            <!-- Materie escluse -->
            <fieldset class="mb-6">
                <legend class="w-full text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold flex items-center justify-between gap-3">
                    <span>Materie escluse <span class="text-slate-500 font-normal lowercase">(facoltativo, max 3)</span></span>
                    <span id="excludeCount" class="text-indigo-300 text-sm normal-case tracking-normal px-2 py-0.5 rounded bg-indigo-500/15">0/3</span>
                </legend>
                <div id="excludedChips" class="flex flex-wrap gap-2 mb-2"></div>
                <select id="excludeSelect" class="w-full bg-slate-900/70 border border-white/10 rounded-lg px-3 py-2 text-sm focus:border-indigo-400 focus:outline-none">
                    <option value="">— Aggiungi una materia da escludere —</option>
                </select>
            </fieldset>

            <button id="startBtn" class="w-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 hover:from-indigo-400 hover:to-fuchsia-400 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-500/30 transition">
                Inizia il quiz
            </button>
            <p id="setupError" class="text-rose-400 text-sm mt-3 hidden"></p>
        </div>

        <div class="glass rounded-2xl p-6 mt-5 shadow-xl">
            <div class="flex items-center justify-between mb-3 flex-wrap gap-3">
                <h3 class="text-base font-semibold flex items-center gap-2">
                    <span class="text-amber-300">🏆</span> Classifica Top 5
                </h3>
                <div class="inline-flex rounded-lg bg-slate-900/60 p-1 text-xs" data-leaderboard-tabs="setup">
                    <button type="button" data-tab="adattiva" class="lb-tab px-3 py-1 rounded-md transition bg-indigo-500/30 text-white">Adattiva</button>
                    <button type="button" data-tab="manuale" class="lb-tab px-3 py-1 rounded-md transition text-slate-400 hover:text-slate-200">Manuale</button>
                </div>
            </div>
            <p class="text-[11px] text-slate-500 mb-3" id="leaderboardTotal"></p>
            <ol id="leaderboardList" class="space-y-2 text-sm"></ol>
        </div>
    </section>
</template>

<template id="tpl-quiz">
    <section class="fadein">
        <!-- Progress -->
        <div class="mb-5">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
                <span id="quizProgressLabel">Pagina 1</span>
                <span id="quizCounterLabel">5 domande</span>
            </div>
            <div class="h-1.5 bg-white/5 rounded-full overflow-hidden">
                <div id="quizProgressBar" class="h-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 transition-all" style="width:0%"></div>
            </div>
        </div>

        <div id="quizCards" class="space-y-4"></div>

        <div class="mt-6 flex items-center justify-between">
            <button id="resetBtn" class="text-sm text-slate-500 hover:text-slate-300">Annulla quiz</button>
            <button id="nextBtn" class="bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-6 py-3 rounded-xl shadow-lg shadow-indigo-500/30 transition disabled:opacity-50 disabled:cursor-not-allowed">
                Avanti →
            </button>
        </div>
    </section>
</template>

<template id="tpl-loading">
    <section class="fadein">
        <div class="glass rounded-2xl p-10 text-center shadow-xl">
            <div class="spinner mx-auto"></div>
            <h2 class="text-lg font-semibold mt-5">Sto valutando le tue risposte…</h2>
            <p class="text-sm text-slate-400 mt-1" id="loadingHint">Claude Haiku sta confrontando le tue risposte con la rubrica.</p>
        </div>
    </section>
</template>

<template id="tpl-results">
    <section class="fadein">
        <div class="glass rounded-2xl p-6 md:p-8 shadow-xl text-center">
            <p class="text-xs uppercase tracking-wider text-slate-400">Punteggio finale di <span id="finalName" class="text-indigo-300"></span></p>
            <div class="my-3 text-6xl font-bold bg-gradient-to-r from-indigo-300 to-fuchsia-300 bg-clip-text text-transparent" id="finalScore">—</div>
            <p class="text-sm text-slate-400" id="finalLabel"></p>
            <div id="lbScoreBlock" class="mt-4 hidden">
                <div class="inline-flex items-center gap-3 px-4 py-2 rounded-xl bg-amber-500/10 border border-amber-400/20">
                    <span class="text-amber-300">🏆</span>
                    <div class="text-left">
                        <p class="text-[10px] uppercase tracking-wider text-amber-200/70">Punti classifica</p>
                        <p class="text-2xl font-bold text-amber-300" id="lbScoreValue">—</p>
                    </div>
                    <p class="text-[11px] text-amber-200/60 max-w-[14rem] leading-tight">
                        Combinazione di score, difficoltà raggiunta e specificità.
                    </p>
                </div>
            </div>
            <p id="finalRank" class="mt-3 text-sm hidden"></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
            <div class="glass rounded-xl p-5">
                <p class="text-xs uppercase tracking-wider text-slate-400 mb-2">Domande</p>
                <p class="text-2xl font-bold" id="statsCount">—</p>
            </div>
            <div class="glass rounded-xl p-5">
                <p class="text-xs uppercase tracking-wider text-slate-400 mb-2">Difficoltà media</p>
                <p class="text-2xl font-bold" id="statsAvgDiff">—</p>
            </div>
            <div class="glass rounded-xl p-5">
                <p class="text-xs uppercase tracking-wider text-slate-400 mb-2">Livello raggiunto</p>
                <p class="text-2xl font-bold" id="statsLevel">—</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div class="glass rounded-xl p-5">
                <p class="text-xs uppercase tracking-wider text-slate-400 mb-3">Materie più forti</p>
                <ul id="topMaterie" class="space-y-2 text-sm"></ul>
            </div>
            <div class="glass rounded-xl p-5">
                <p class="text-xs uppercase tracking-wider text-slate-400 mb-3">Materie più deboli</p>
                <ul id="bottomMaterie" class="space-y-2 text-sm"></ul>
            </div>
        </div>

        <details class="glass rounded-xl mt-4 p-5">
            <summary class="font-semibold flex items-center justify-between">
                <span>Rivedi tutte le risposte</span>
                <span class="text-slate-400 text-xs">Tocca per espandere ↓</span>
            </summary>
            <div id="reviewList" class="mt-4 space-y-3"></div>
        </details>

        <div class="glass rounded-2xl p-6 mt-4 shadow-xl">
            <div class="flex items-center justify-between mb-3 flex-wrap gap-3">
                <h3 class="text-base font-semibold flex items-center gap-2">
                    <span class="text-amber-300">🏆</span> Classifica Top 5
                </h3>
                <div class="inline-flex rounded-lg bg-slate-900/60 p-1 text-xs" data-leaderboard-tabs="result">
                    <button type="button" data-tab="adattiva" class="lb-tab px-3 py-1 rounded-md transition bg-indigo-500/30 text-white">Adattiva</button>
                    <button type="button" data-tab="manuale" class="lb-tab px-3 py-1 rounded-md transition text-slate-400 hover:text-slate-200">Manuale</button>
                </div>
            </div>
            <p class="text-[11px] text-slate-500 mb-3" id="resultLeaderboardTotal"></p>
            <ol id="resultLeaderboardList" class="space-y-2 text-sm"></ol>
        </div>

        <button id="restartBtn" class="mt-6 w-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 hover:from-indigo-400 hover:to-fuchsia-400 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-500/30 transition">
            Nuovo quiz
        </button>
    </section>
</template>

<script src="app.js?v=14"></script>
</body>
</html>
